name: Construire Streamly

on:
  push:
    paths:
      - "streamly.zip"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Décompresser le projet
        run: unzip -o streamly.zip -d project

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Clé de signature
        env:
          KS: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > project/app/release.jks
            echo "Clé de signature trouvée"
          else
            echo "::warning::Pas de clé KEYSTORE_B64 : les mises à jour ne pourront pas s'installer par-dessus l'ancienne version."
          fi

      - name: Compiler l'appli
        working-directory: project
        env:
          KS_PASS: streamly2026
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Préparer le fichier
        run: cp project/app/build/outputs/apk/release/app-release.apk streamly.apk

      - name: Publier le fichier .apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Streamly (dernière version)
          body: "Version ${{ github.run_number }}"
          files: streamly.apk
          make_latest: true
